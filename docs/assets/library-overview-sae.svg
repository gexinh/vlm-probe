<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="754" viewBox="0 100 1600 754" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">VLMProbe: lens, attention, causal and SAE analysis</title>
  <desc id="figure-description">Four-stage library overview. Native language, vision-language and vision inputs are bound through Prober and a model adapter. Layer and head selection, token groups, target scores and optional training or loading configure four tool families: Lens (including MJ-Lens), Attention, Causal and SAE. Results include readouts, attribution maps, measured interventions and sparse features. Structured experiment artifacts retain analysis results, figures, fitted lenses and SAE dictionaries.</desc>
  <metadata id="draft-metadata">New four-family overview; approved three-family baseline preserved separately. All four miniature plots are schematic and contain no experimental measurements. Generated by tools/build_library_overview_sae.py; editable SVG text and shapes.</metadata>
