[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmprobe"
dynamic = ["version"]
description = "Lens, attention, causal and sparse feature probes for language, vision and multimodal models"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
license-files = [
  "LICENSE",
  "NOTICE.md",
  "src/vlm_probing/_vendor/chefer2021/LICENSE",
  "src/vlm_probing/sae/licenses/*.txt",
]
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]
authors = [
  {name = "Gexin Huang"},
  {name = "Haisheng Fu"},
  {name = "Ruinan Jin"},
  {name = "Xiaoxiao Li"},
]
keywords = ["interpretability", "probing", "vision-language-models", "mechanistic-interpretability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://ubc-tea.github.io/vlm-probe/"
Documentation = "https://github.com/ubc-tea/vlm-probe/tree/main/docs"
Source = "https://github.com/ubc-tea/vlm-probe"
Issues = "https://github.com/ubc-tea/vlm-probe/issues"
Report = "https://github.com/ubc-tea/vlm-probe/blob/main/docs/assets/vlmprobe-technical-report.pdf"
"Pre-release source" = "https://github.com/gexinh/vlm-probe"
"Report sources" = "https://github.com/gexinh/vlm-probing-report"
Paper = "https://arxiv.org/abs/2610.33072"
"Video demo" = "https://drive.google.com/file/d/1vELcJ0T67VzG6_x4r79uQmDQRQUELXP2/view?usp=sharing"

[project.optional-dependencies]
sae = ["torch>=2.6", "numpy>=1.26,<3", "safetensors>=0.4,<1", "huggingface_hub>=0.30,<2"]
visualization = ["matplotlib>=3.8", "Pillow>=10", "numpy>=1.26"]
evaluation = ["numpy>=1.26,<3", "scikit-learn>=1.3,<2"]
transformers = ["transformers>=5.3,<5.4", "torch>=2.4", "torchvision>=0.19", "accelerate>=1.0", "Pillow>=10"]
notebooks = ["jupyterlab>=4", "nbclient>=0.10", "matplotlib>=3.8", "Pillow>=10", "numpy>=1.26", "tokenizers>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vlmprobe*", "vlm_probing*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "vlm_probing.__version__"}

[tool.setuptools.package-data]
"vlm_probing._vendor.chefer2021" = ["LICENSE", "README.md"]
"vlm_probing.sae" = ["resources/*.json", "resources/*.json.gz", "licenses/*.txt"]
