name: Library regressions

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/test_attention*.py"
      - "tests/test_causal*.py"
      - "tests/test_metric_analysis_precision.py"
      - "tests/test_sae_analysis_precision.py"
      - "tests/test_gradcam_support.py"
      - "tests/test_consumed_attention.py"
      - "tests/test_qwen_text_adapters.py"
      - "tests/test_jacobian_contract.py"
      - "tests/test_input_geometry.py"
      - "tests/test_mj*.py"
      - "tests/test_visualization*.py"
      - "tests/test_notebook_setup.py"
      - "tests/test_sae_evaluation.py"
      - "tests/test_dino_sae_adapter.py"
      - "tests/test_sae_importers.py"
      - "tests/test_sae_pretrained.py"
      - "tests/test_sae_documentation.py"
      - "tools/prepare_notebook_setup.py"
      - "examples/hf_model_matrix.py"
      - "examples/hf_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/attention-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/test_attention*.py"
      - "tests/test_causal*.py"
      - "tests/test_metric_analysis_precision.py"
      - "tests/test_sae_analysis_precision.py"
      - "tests/test_gradcam_support.py"
      - "tests/test_consumed_attention.py"
      - "tests/test_qwen_text_adapters.py"
      - "tests/test_jacobian_contract.py"
      - "tests/test_input_geometry.py"
      - "tests/test_mj*.py"
      - "tests/test_visualization*.py"
      - "tests/test_notebook_setup.py"
      - "tests/test_sae_evaluation.py"
      - "tests/test_dino_sae_adapter.py"
      - "tests/test_sae_importers.py"
      - "tests/test_sae_pretrained.py"
      - "tests/test_sae_documentation.py"
      - "tools/prepare_notebook_setup.py"
      - "examples/hf_model_matrix.py"
      - "examples/hf_smoke.py"
      - "pyproject.toml"
      - ".github/workflows/attention-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attention:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies and library
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[transformers,visualization,sae,evaluation]' pytest
      - name: Run native model and numerical regressions
        run: |
          python -m unittest discover -s tests -p 'test_attention*.py' -v
          python -m unittest discover -s tests -p 'test_causal*.py' -v
          python -m unittest discover -s tests -p test_metric_analysis_precision.py -v
          python -m unittest discover -s tests -p test_gradcam_support.py -v
          python -m unittest discover -s tests -p test_consumed_attention.py -v
          python -m unittest discover -s tests -p test_qwen_text_adapters.py -v
          python -m unittest discover -s tests -p test_jacobian_contract.py -v
          python -m unittest discover -s tests -p test_input_geometry.py -v
          python -m unittest discover -s tests -p 'test_mj*.py' -v
          python -m unittest discover -s tests -p 'test_visualization*.py' -v
      - name: Run tutorial setup and pretrained SAE contracts
        run: |
          python -m pytest tests/test_notebook_setup.py tests/test_sae_evaluation.py tests/test_dino_sae_adapter.py tests/test_sae_importers.py tests/test_sae_pretrained.py tests/test_sae_documentation.py tests/test_sae_analysis_precision.py -v
