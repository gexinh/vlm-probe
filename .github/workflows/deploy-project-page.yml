name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'docs/project-page/**'
      - 'docs/assets/vlmprobe-technical-report.pdf'
      - 'docs/assets/library-overview-sae.svg'
      - 'docs/assets/tutorials/lens-mj-report-region-tokens.png'
      - 'tools/build_project_page.py'
      - 'tools/build_sae_model_pages.py'
      - 'src/vlm_probing/sae/resources/**'
      - 'docs/methods/sae/models/**'
      - '.github/workflows/deploy-project-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static project page
        run: python3 tools/build_project_page.py --output _site
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
